name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-alpha.txt

      - name: Check
        run: deno task check

      - name: Test
        run: deno task test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser
        run: deno task browser:install --with-deps

      - name: Browser regression
        run: deno task test:browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.os }}
          path: output/playwright/
          if-no-files-found: ignore

      - name: Build and verify installed Windows release
        if: runner.os == 'Windows'
        run: deno task release:windows

      - name: Upload verified Windows beta
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rowcall-windows-x64
          path: |
            dist/windows-release/*
            packaging/install.ps1
            docs/windows-beta-test.md
          if-no-files-found: error
