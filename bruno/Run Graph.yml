info:
  name: Run Graph
  type: http
  seq: 5

http:
  method: POST
  url: "{{HOST}}/run-graph"
  body:
    type: json
    data: |-
      {
        "graph": {
        "nodes": [
          {
            "id": "a",
            "code": "x = 1\ny = z + 2",
            "outputs": ["x", "y"]
          },
          {
            "id": "b",
            "code": "z = x + y",
            "outputs": ["z"]
          }
        ],
        "edges": [
          { "fromNode": "a", "toNode": "b" }
        ]
      },
        "inputs": {
          "z": 20000
        },
        "trace": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
